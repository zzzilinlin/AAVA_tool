test_size: 0.2
random_state: 42
selection_metric: "f1_weighted"
sample_size: 500

tfidf:
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2

logistic_regression:
  C: 1.0
  max_iter: 1000
  random_state: 42
  class_weight: "balanced"
  solver: "lbfgs"
  n_jobs: -1

sbert:
  model_name: "sentence-transformers/distiluse-base-multilingual-cased-v2"
  batch_size: 64

ridge:
  alpha: 1.0
