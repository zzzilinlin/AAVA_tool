test_size: 0.2
random_state: 42
selection_metric: "f1_weighted"

tfidf:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2

logistic_regression:
  C: 1.0
  max_iter: 1000
  random_state: 42
  class_weight: "balanced"

random_forest:
  n_estimators: 100
  max_depth: 10
  random_state: 42
  class_weight: "balanced"
  n_jobs: -1

gradient_boosting:
  n_estimators: 100
  max_depth: 5
  learning_rate: 0.1
  random_state: 42

svm:
  C: 1.0
  kernel: "rbf"
  random_state: 42
  class_weight: "balanced"

naive_bayes:
  alpha: 1.0

setfit:
  model_name: "sentence-transformers/paraphrase-MiniLM-L6-v2"
  batch_size: 16
  num_epochs: 1
  num_iterations: 20
